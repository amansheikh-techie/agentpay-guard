services:
  - type: web
    name: agentpay-guard
    runtime: python
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
      - key: AI_PROVIDER
        value: none
      - key: PAYPAL_MODE
        value: sandbox
      - key: DATABASE_URL
        value: "sqlite:///./data/agentpay_guard.db"
      - key: FRONTEND_ORIGIN
        value: "https://agentpay-guard-zcet.onrender.com"
      # TODO: Set FRONTEND_BASE_URL to your real deployed URL for PayPal return/cancel redirects; do not guess it.
      - key: FRONTEND_BASE_URL
        value: "https://agentpay-guard-zcet.onrender.com"

